<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Minhas Tarefas | Firebase</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;800&display=swap"
    rel="stylesheet"
  />

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="style.css"
  />

  <!-- Ícone da página -->
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>"
  />

</head>


<body>

  <!-- ======================================================
       TELA DE CARREGAMENTO
       ====================================================== -->

  <div
    id="tela-carregando"
    class="carregando"
  >
    Carregando…
  </div>


  <!-- ======================================================
       LOGIN / CADASTRO
       ====================================================== -->

  <main
    id="tela-auth"
    class="auth"
    hidden
  >

    <h1 class="marca">
      Minhas Tarefas
    </h1>

    <p class="subtitulo">
      Suas tarefas salvas na nuvem e sincronizadas em tempo real.
    </p>


    <!-- Abas -->

    <div
      class="abas"
      role="tablist"
    >

      <button
        id="aba-login"
        class="aba ativa"
        role="tab"
        aria-selected="true"
        type="button"
      >
        Entrar
      </button>


      <button
        id="aba-cadastro"
        class="aba"
        role="tab"
        aria-selected="false"
        type="button"
      >
        Criar conta
      </button>

    </div>


    <!-- Formulário -->

    <form
      id="form-auth"
      class="form-auth"
      novalidate
    >

      <!-- E-mail -->

      <label for="email">
        E-mail
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        required
        placeholder="voce@email.com"
      />


      <!-- Senha -->

      <label for="senha">
        Senha
      </label>

      <input
        id="senha"
        type="password"
        autocomplete="current-password"
        required
        minlength="6"
        placeholder="Mínimo de 6 caracteres"
      />


      <!-- Mensagem de erro/sucesso -->

      <p
        id="msg-auth"
        class="mensagem"
        role="alert"
      ></p>


      <!-- Botão entrar/cadastrar -->

      <button
        id="btn-auth"
        type="submit"
        class="btn-primario"
      >
        Entrar
      </button>


      <!-- Recuperação de senha -->

      <button
        id="btn-esqueci"
        type="button"
        class="btn-link"
      >
        Esqueci minha senha
      </button>

    </form>

  </main>


  <!-- ======================================================
       APLICAÇÃO PRINCIPAL — MINHAS TAREFAS
       ====================================================== -->

  <main
    id="tela-app"
    class="app"
    hidden
  >

    <!-- ====================================================
         CABEÇALHO
         ==================================================== -->

    <header class="topo">

      <div>

        <h1 class="marca marca-pequena">
          Minhas Tarefas
        </h1>

        <p
          id="usuario-email"
          class="usuario"
        ></p>

      </div>


      <!-- Logout -->

      <button
        id="btn-sair"
        class="btn-secundario"
        type="button"
      >
        Sair
      </button>

    </header>


    <!-- ====================================================
         PROGRESSO
         ==================================================== -->

    <section
      class="progresso"
      aria-live="polite"
    >

      <p
        id="progresso-texto"
        class="progresso-texto"
      >
        0 de 0 concluídas
      </p>


      <div class="barra">

        <div
          id="barra-preenchida"
          class="barra-preenchida"
        ></div>

      </div>

    </section>


    <!-- ====================================================
         ADICIONAR TAREFA
         ==================================================== -->

    <form
      id="form-tarefa"
      class="form-tarefa"
    >

      <label
        for="nova-tarefa"
        class="sr-only"
      >
        Nova tarefa
      </label>


      <input
        id="nova-tarefa"
        type="text"
        maxlength="200"
        placeholder="O que você precisa fazer?"
        autocomplete="off"
      />


      <button
        type="submit"
        class="btn-primario"
      >
        Adicionar
      </button>

    </form>


    <!-- ====================================================
         FILTROS
         ==================================================== -->

    <div
      class="filtros"
      role="group"
      aria-label="Filtrar tarefas"
    >

      <button
        class="filtro ativo"
        data-filtro="todas"
        type="button"
      >
        Todas
      </button>


      <button
        class="filtro"
        data-filtro="pendentes"
        type="button"
      >
        Pendentes
      </button>


      <button
        class="filtro"
        data-filtro="concluidas"
        type="button"
      >
        Concluídas
      </button>

    </div>


    <!-- ====================================================
         LISTA DE TAREFAS
         ==================================================== -->

    <ul
      id="lista-tarefas"
      class="lista"
    ></ul>


    <!-- Mensagem quando não existem tarefas -->

    <p
      id="lista-vazia"
      class="vazio"
      hidden
    >
      Nenhuma tarefa aqui. Adicione a primeira no campo acima.
    </p>

  </main>


  <!-- ======================================================
       FIREBASE / JAVASCRIPT
       
       type="module" permite usar os imports do Firebase
       ====================================================== -->

  <script
    type="module"
    src="app.js"
  ></script>

</body>

</html>
